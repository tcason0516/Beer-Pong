<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Garage Pong</title>
<style>
  :root {
    --ink: #f4efe4;
    --dim: rgba(244, 239, 228, 0.66);
    --red: #d3202a;
    --tape: #e9dcb8;
    --panel: rgba(18, 16, 14, 0.78);
    --cond: "Roboto Condensed", "sans-serif-condensed", "Arial Narrow", Impact, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--ink); font-family: system-ui, Roboto, sans-serif; touch-action: none; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #touch { position: fixed; inset: 0; z-index: 2; }
  #vignette { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(ellipse 85% 75% at 50% 48%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.42) 100%); }
  .hidden { display: none !important; }
  .screen { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: max(24px, env(safe-area-inset-top)) 22px max(24px, env(safe-area-inset-bottom)); }

  /* loading */
  #loading { background: radial-gradient(ellipse at 50% 40%, #2a2420 0%, #0b0a09 70%); z-index: 50; }
  #loading .cup { width: 54px; height: 64px; background: linear-gradient(90deg, #8e0f16, #d3202a 40%, #a3121b); clip-path: polygon(0 0, 100% 0, 82% 100%, 18% 100%); border-top: 6px solid #f1ede4; animation: bob 1.1s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(-4deg); } }
  #loadText { margin-top: 22px; font-family: var(--cond); letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); font-size: 14px; text-align: center; max-width: 80vw; }

  /* title */
  #title { background: linear-gradient(180deg, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.15) 38%, rgba(0,0,0,0.25) 60%, rgba(0,0,0,0.85) 100%); justify-content: space-between; }
  .logo { margin-top: 6vh; text-align: center; }
  .logo h1 { margin: 0; font-family: var(--cond); font-weight: 800; font-size: clamp(46px, 15vw, 84px); line-height: 0.88; letter-spacing: -0.01em; text-transform: uppercase; color: var(--ink); text-shadow: 0 3px 0 #000, 0 8px 30px rgba(0,0,0,0.8); }
  .logo h1 span { color: var(--red); display: block; }
  .tape { display: inline-block; margin-top: 14px; background: var(--tape); color: #2a2318; font-family: var(--cond); font-weight: 700; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; padding: 6px 14px; transform: rotate(-2deg); box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
  .pick { width: 100%; max-width: 460px; }
  .pick h2 { font-family: var(--cond); font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; font-size: 13px; color: var(--dim); margin: 0 0 10px 4px; }
  .opp { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--panel); border: 1px solid rgba(255,255,255,0.1); border-left: 4px solid var(--red); color: var(--ink); padding: 14px 16px; margin-bottom: 10px; border-radius: 6px; font: inherit; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .opp:active { transform: scale(0.98); background: rgba(40, 30, 26, 0.9); }
  .opp .who { flex: 1; }
  .opp b { display: block; font-family: var(--cond); font-size: 22px; font-weight: 700; letter-spacing: 0.02em; }
  .opp small { color: var(--dim); font-size: 13px; font-style: italic; }
  .lvl { font-family: var(--cond); font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: #2a2318; background: var(--tape); padding: 4px 8px; border-radius: 3px; white-space: nowrap; }

  /* hud */
  #hud { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
  .bar { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .side { background: var(--panel); border-radius: 8px; padding: 8px 10px; min-width: 112px; }
  .side .nm { font-family: var(--cond); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; font-size: 13px; }
  .side.opp-side { text-align: right; }
  .cups { display: grid; grid-template-columns: repeat(5, 12px); gap: 4px; margin-top: 6px; }
  .opp-side .cups { justify-content: end; }
  .cups i { width: 12px; height: 14px; background: var(--red); clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%); border-top: 2px solid #f1ede4; }
  .cups i.gone { background: rgba(255,255,255,0.12); border-top-color: rgba(255,255,255,0.15); }
  #pauseBtn { pointer-events: auto; width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--panel); color: var(--ink); font-size: 16px; font-weight: 800; letter-spacing: -1px; }
  #banner { position: absolute; top: 18%; left: 0; right: 0; text-align: center; font-family: var(--cond); font-weight: 800; font-size: clamp(30px, 10vw, 54px); text-transform: uppercase; letter-spacing: 0.02em; text-shadow: 0 3px 0 #000, 0 6px 24px rgba(0,0,0,0.8); opacity: 0; transform: translateY(10px) scale(0.96); transition: opacity 0.25s, transform 0.25s; }
  #banner.show { opacity: 1; transform: none; }
  #caption { position: absolute; left: 50%; bottom: 25%; transform: translate(-50%, 8px); width: max-content; max-width: 86vw; background: rgba(10,9,8,0.82); padding: 10px 14px; border-radius: 10px; font-size: 16px; line-height: 1.3; opacity: 0; transition: opacity 0.2s, transform 0.2s; text-align: center; }
  #caption b { color: #ffb0b0; font-weight: 700; margin-right: 4px; }
  #caption.show { opacity: 1; transform: translate(-50%, 0); }
  #hint { position: absolute; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: 88vw; text-align: center; font-size: 14px; color: var(--ink); background: rgba(10,9,8,0.6); padding: 10px 12px; border-radius: 10px; opacity: 0; transition: opacity 0.3s; }
  #hint.show { opacity: 1; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.7; } }
  #meter { position: absolute; right: 14px; top: 26%; height: 44%; width: 12px; border-radius: 6px; background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.25); overflow: hidden; opacity: 0; transition: opacity 0.15s; }
  #meter.show { opacity: 1; }
  #meterZone { position: absolute; left: 0; right: 0; background: rgba(211, 32, 42, 0.55); }
  #meterFill { position: absolute; left: 3px; right: 3px; bottom: 0; background: #f4efe4; border-radius: 3px; height: 0; }

  /* menus */
  .card { width: 100%; max-width: 380px; background: rgba(18,16,14,0.92); border-radius: 14px; padding: 22px; border: 1px solid rgba(255,255,255,0.08); }
  .card h3 { margin: 0 0 16px; font-family: var(--cond); font-weight: 800; font-size: 30px; text-transform: uppercase; text-align: center; }
  .btn { display: block; width: 100%; padding: 14px; margin-top: 10px; border: 0; border-radius: 8px; font: 700 17px var(--cond); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); background: rgba(255,255,255,0.1); }
  .btn.primary { background: var(--red); }
  .btn:active { transform: scale(0.98); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 9px 0; font-size: 15px; color: var(--dim); }
  .row input[type=range] { flex: 1; max-width: 170px; accent-color: var(--red); }
  .row input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--red); }
  #pause, #over { background: rgba(0,0,0,0.55); }
  #overSub { text-align: center; color: var(--dim); margin: -6px 0 10px; }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="vignette"></div>
  <div id="touch"></div>

  <div id="loading" class="screen">
    <div class="cup"></div>
    <div id="loadText">Opening the garage…</div>
  </div>

  <div id="title" class="screen hidden">
    <div class="logo">
      <h1>Garage<span>Pong</span></h1>
      <div class="tape">House rules · loser buys the next case</div>
    </div>
    <div class="pick">
      <h2>Who are you playing?</h2>
      <button class="opp" data-opp="rick"><div class="who"><b>Uncle Rick</b><small>"Back in '94 I was unbeatable."</small></div><span class="lvl">Casual</span></button>
      <button class="opp" data-opp="tyler"><div class="who"><b>Tyler</b><small>"Loser buys the next case."</small></div><span class="lvl">Regular</span></button>
      <button class="opp" data-opp="mike"><div class="who"><b>Big Mike</b><small>"Haven't lost on this table since college."</small></div><span class="lvl">Frat Legend</span></button>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div class="bar">
      <div class="side"><div class="nm">You</div><div class="cups" id="cupsYou"></div></div>
      <button id="pauseBtn" aria-label="Pause">II</button>
      <div class="side opp-side"><div class="nm" id="oppName">Opponent</div><div class="cups" id="cupsOpp"></div></div>
    </div>
    <div id="banner"></div>
    <div id="caption"></div>
    <div id="hint"></div>
    <div id="meter"><div id="meterZone"></div><div id="meterFill"></div></div>
  </div>

  <div id="pause" class="screen hidden">
    <div class="card">
      <h3>Paused</h3>
      <div class="row">Trash talk <input type="range" id="vol_voice" min="0" max="1.5" step="0.05"></div>
      <div class="row">Party crowd <input type="range" id="vol_crowd" min="0" max="1.5" step="0.05"></div>
      <div class="row">Sound effects <input type="range" id="vol_sfx" min="0" max="1.5" step="0.05"></div>
      <div class="row">Captions <input type="checkbox" id="opt_captions"></div>
      <div class="row">Throw power meter <input type="checkbox" id="opt_meter"></div>
      <button class="btn primary" id="resumeBtn">Resume</button>
      <button class="btn" id="restartBtn">Restart game</button>
      <button class="btn" id="quitBtn">Change opponent</button>
    </div>
  </div>

  <div id="over" class="screen hidden">
    <div class="card">
      <h3 id="overTitle">You win!</h3>
      <p id="overSub"></p>
      <button class="btn primary" id="rematchBtn">Rematch</button>
      <button class="btn" id="menuBtn">Change opponent</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
