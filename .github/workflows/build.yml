name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build game bundle
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/GaragePong.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GaragePong-apk
          path: dist/GaragePong.apk

      - name: Publish "latest" release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Garage Pong (latest build)
          body: |
            Latest build from `${{ github.sha }}`.
            Download **GaragePong.apk** on your Android phone and open it to install
            (allow "Install unknown apps" for your browser when asked).
          prerelease: false
          make_latest: true
          files: dist/GaragePong.apk
